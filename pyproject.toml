[project]
name = "agent-service-toolkit"
version = "0.1.0"
description = "AI agent service built with LangGraph and FastAPI, streaming the AG-UI protocol"
readme = "README.md"
authors = [{ name = "Joshua Carroll", email = "carroll.joshk@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.11"

dependencies = [
    "ag-ui-langgraph[fastapi]==0.0.47",
    "fastapi ~=0.163.1",
    "httpx ~=0.28.1",
    "langchain-core ~=1.8.1",
    "langchain-community ~=0.4.2",
    "langchain-anthropic ~=1.7.10",
    "langchain-aws ~=1.9.3",
    "langchain-google-genai ~=4.5.0",
    "langchain-groq ~=1.1.3",
    "langchain-ollama ~=1.1.0",
    "langchain-openai ~=1.8.0",
    "langchain-postgres ~=0.0.19",
    "langfuse ~=5.2.0",
    "langgraph ~=1.2.22",
    "langgraph-checkpoint-postgres ~=3.2.1",
    "langgraph-checkpoint-sqlite ~=3.1.3",
    "langsmith ~=0.14.17",
    "numexpr ~=2.14.2",
    "psycopg[binary,pool] ~=3.3.9",
    "pydantic ~=2.14.3",
    "pydantic-settings ~=2.16.3",
    "python-dotenv ~=1.2.4",
    "uvicorn ~=0.54.0",
    "langchain-openrouter>=0.2.9",
    "pypdf>=7.1.0",
    "beautifulsoup4 ~=4.15.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem] ~=0.4.43",
    "pre-commit ~=4.7.0",
    "pytest ~=9.2.0",
    "pytest-cov ~=7.1.0",
    "pytest-env ~=1.8.5",
    "pytest-asyncio ~=1.5.0",
    "ruff ~=0.17.5",
    "mypy ~=2.4.1",
    "playwright ~=1.65.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff <0.17 default rule set
extend-select = ["I", "U"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
OPENAI_API_KEY = "sk-fake-openai-key"

[tool.mypy]
plugins = "pydantic.mypy"

[[tool.mypy.overrides]]
module = ["numexpr.*", "ag_ui_langgraph.*"]
follow_untyped_imports = true
