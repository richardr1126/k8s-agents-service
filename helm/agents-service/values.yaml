# Default values for agents-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# API keys and settings come from `app-secrets` (helm/create_secrets.sh). The database
# settings point at the CloudNativePG cluster below; its password is in `agents-service-db-app`,
# which CloudNativePG generates. The host assumes the release is named agents-service.
x-db-env: &db-env
  - name: DATABASE_TYPE
    value: postgres
  - name: POSTGRES_HOST
    value: agents-service-db-rw
  - name: POSTGRES_PORT
    value: "5432"
  - name: POSTGRES_DB
    value: agentsservice
  - name: POSTGRES_USER
    value: agentsservice
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: agents-service-db-app
        key: password

envFrom:
  - secretRef:
      name: app-secrets

env: *db-env

# Postgres with pgvector: a CloudNativePG Cluster (templates/database.yaml).
# The standard images ship pgvector.
database:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-standard-trixie
  size: 5Gi
  storageClass: local-path-retain
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/richardr1126/k8s-agents-service
  # `latest` is rebuilt on every push to main, so always pull it.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This will set the configuration for CronJob
cronjob:
  enabled: true
  # Test schedule - run every 2 minutes for debugging
  # schedule: "*/2 * * * *"
  # Run every day at 1:30 AM UTC (original schedule)
  # schedule: "53 1 * * *"
  # Run every day at 7 AM UTC
  schedule: "0 7 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  restartPolicy: OnFailure
  env: *db-env
  # Add starting deadline to help with timing issues
  startingDeadlineSeconds: 300
  # Use the cron-specific image
  image:
    repository: ghcr.io/richardr1126/k8s-agents-cron
    tag: "latest"
    pullPolicy: Always
  # No need to override command/args - Dockerfile sets the correct CMD
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "traefik"
  annotations:
    #cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: agents.richardr.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  hosts:
    - host: agents.richardr.dev
      paths:
        - path: /
          pathType: Prefix
  # tls:
  #   - secretName: web-api-tls
  #     hosts:
  #       - api.richardr.dev

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# The images are built for arm64 only (.github/workflows/docker-publish.yml).
nodeSelector:
  kubernetes.io/arch: arm64

tolerations: []

affinity: {}
